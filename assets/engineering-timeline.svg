<path d="M128 85V336" stroke="#adc3d7" stroke-width="2"/>
<circle cx="128" cy="89" r="6" fill="#245e8a"/>
<text x="25" y="94" fill="#245e8a" font-size="15" font-weight="bold">JAN–MAR</text>
<text x="153" y="95" fill="#21374c" font-size="21" font-weight="bold">Orders and conversation state</text>
<text x="153" y="123" fill="#405970" font-size="16">Keep deliveries and attachments tied to the right conversation.</text>
