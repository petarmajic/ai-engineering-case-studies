<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 450" role="img" aria-labelledby="t d"><title id="t">Selected engineering work in 2026</title><desc id="d">A timeline from support tools and retrieval to supplier file intake.</desc><rect width="340" height="450" rx="8" fill="#f7f9fc"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="16" y="27" fill="#21374c" font-size="16" font-weight="bold">Selected engineering work · 2026</text><path d="M19 54V360" stroke="#adc3d7" stroke-width="2"/>
<circle cx="19" cy="58" r="4" fill="#245e8a"/>
<text x="34" y="62" fill="#245e8a" font-size="12" font-weight="bold">JAN–MAR</text>
<text x="34" y="85" fill="#21374c" font-size="17" font-weight="bold">Orders and conversation state</text>
<text x="34" y="108" fill="#405970" font-size="14">Keep deliveries and attachments tied</text><text x="34" y="125" fill="#405970" font-size="14">to the right conversation.</text>
