<text x="34" y="266" fill="#245e8a" font-size="12" font-weight="bold">SEP–OCT</text>
<text x="34" y="289" fill="#21374c" font-size="17" font-weight="bold">Knowledge releases</text>
<text x="34" y="312" fill="#405970" font-size="14">Review a draft before making it</text><text x="34" y="329" fill="#405970" font-size="14">available to chat.</text>
<circle cx="19" cy="364" r="4" fill="#107363"/>
<text x="34" y="368" fill="#107363" font-size="12" font-weight="bold">NOV</text>
<text x="34" y="391" fill="#21374c" font-size="17" font-weight="bold">Supplier file intake</text>
<text x="34" y="414" fill="#405970" font-size="14">Reject incomplete files before</text><text x="34" y="431" fill="#405970" font-size="14">replacing accepted data.</text>
