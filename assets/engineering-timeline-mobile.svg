<text x="34" y="164" fill="#245e8a" font-size="12" font-weight="bold">JUL</text>
<text x="34" y="187" fill="#21374c" font-size="17" font-weight="bold">Searchable delivery tables</text>
<text x="34" y="210" fill="#405970" font-size="14">Check a postcode against rows</text><text x="34" y="227" fill="#405970" font-size="14">in the retrieved table.</text>
