<svg xmlns="http://www.w3.org/2000/svg" width="820" height="414" viewBox="0 0 820 414" role="img" aria-labelledby="t d">
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#6c8797"/></marker></defs>
<title id="t">Catalog intake architecture</title><desc id="d">A development command calls the parser and writes only valid files through the Django initial-state service. A separate intended product path includes review, background jobs and AI suggestions.</desc>
<rect x="0" y="0" width="820" height="414" rx="12" fill="#f8fafb" stroke="none"/>
<text x="28" y="40" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="bold" fill="#172f42">Catalog intake architecture</text>
<text x="26" y="75" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" fill="#086753">Implemented · initial load</text>
<rect x="26" y="96" width="225" height="85" rx="7" fill="#eaf2f8" stroke="none"/>
<text x="39" y="122" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#172f42">Local XLSX or CSV</text>
<text x="39" y="145" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#405b6a">A development command</text>
<text x="39" y="165" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#405b6a">opens the supplier file.</text>
<rect x="297" y="96" width="225" height="85" rx="7" fill="#e7f4ed" stroke="none"/>
<text x="310" y="122" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#172f42">Python parser</text>
<text x="310" y="145" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#405b6a">Read typed rows and</text>
<text x="310" y="165" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#405b6a">surface blocking errors.</text>
<rect x="567" y="96" width="225" height="85" rx="7" fill="#eaf2f8" stroke="none"/>
<text x="580" y="122" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#172f42">Django → PostgreSQL</text>
<text x="580" y="145" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#405b6a">Save only when all</text>
<text x="580" y="165" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#405b6a">required rows pass.</text>
<polyline points="253,138 292,138" fill="none" stroke="#6c8797" stroke-width="2" marker-end="url(#arrow)" />
<polyline points="524,138 563,138" fill="none" stroke="#6c8797" stroke-width="2" marker-end="url(#arrow)" />
<polyline points="26,210 792,210" fill="none" stroke="#c2d0d6" stroke-width="2" />
<text x="26" y="243" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" fill="#235e88">Planned product workflow</text>
<rect x="26" y="268" width="215" height="85" rx="7" fill="#eaf2f8" stroke="none"/>
<text x="39" y="294" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#172f42">React</text>
<text x="39" y="317" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#405b6a">Operator review</text>
<text x="39" y="337" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#405b6a">and corrections</text>
<rect x="270" y="268" width="240" height="85" rx="7" fill="#eaf2f8" stroke="none"/>
<text x="283" y="294" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#172f42">Django + Celery</text>
<text x="283" y="317" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#405b6a">Coordinate work and</text>
<text x="283" y="337" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#405b6a">hand off accepted rows.</text>
<rect x="540" y="268" width="252" height="85" rx="7" fill="#eaf2f8" stroke="none"/>
<text x="553" y="294" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#172f42">FastAPI AI service</text>
<text x="553" y="317" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#405b6a">Propose categories</text>
<text x="553" y="337" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#405b6a">and attributes.</text>
<polyline points="242,307 267,307" fill="none" stroke="#6c8797" stroke-width="2" marker-end="url(#arrow)" />
<polyline points="510,307 537,307" fill="none" stroke="#6c8797" stroke-width="2" marker-end="url(#arrow)" />
<text x="26" y="389" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" fill="#405b6a">Downstream destination: an external catalog import service.</text>
</svg>
