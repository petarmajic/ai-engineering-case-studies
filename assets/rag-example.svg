<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img" aria-labelledby="title desc"><title id="title">From a web page to a chat answer</title><desc id="desc">Illustrative example. Source text is chunked into an FAQ entry. Its embedding is stored with the text. A different shopper question retrieves the entry from the active version.</desc><defs><marker id="tip" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L7 4L0 8Z" fill="#8093a4"/></marker></defs>
<rect x="0" y="0" width="880" height="360" rx="0" fill="#fff" stroke="none"/>
<text x="16" y="28" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="600" fill="#245db5">Preparing the knowledge base</text>
<rect x="16" y="54" width="222" height="129" rx="6" fill="white" stroke="#d3dfe8"/>
<rect x="17" y="55" width="220" height="27" rx="5" fill="#f1f5f9" stroke="none"/>
<text x="28" y="74" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="600" fill="#52667b">Scraped page · Delivery FAQ</text>
<text x="28" y="107" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="600" fill="#203349">Source chunks</text>
<path d="M29 119h164" fill="none" stroke="#d3dfe8" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="25" y="128" width="204" height="43" rx="3" fill="#eaf3fc" stroke="none"/>
<text x="33" y="146" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#245db5">“An order can ship in</text>
<text x="33" y="164" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#245db5">more than one parcel.”</text>
<rect x="301" y="54" width="231" height="129" rx="6" fill="white" stroke="#d3dfe8"/>
<text x="313" y="75" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="600" fill="#203349">FAQ entry</text>
<text x="313" y="102" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="600" fill="#245db5">Q</text>
<text x="337" y="102" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#203349">Can my items ship</text>
<text x="337" y="120" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#203349">separately?</text>
<text x="313" y="149" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="600" fill="#146c61">A</text>
<text x="337" y="149" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#203349">An order can ship in</text>
<text x="337" y="167" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#203349">more than one parcel.</text>
<path d="M244 121H293" fill="none" stroke="#8093a4" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#tip)"/>
<text x="244" y="111" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#52667b">Select</text>
<path d="M540 121H604" fill="none" stroke="#8093a4" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#tip)"/>
<text x="551" y="111" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#52667b">Embed</text>
<g transform="translate(617 79)" fill="#eaf5f2" stroke="#146c61" stroke-width="2"><path d="M0 8C0 -2 39 -2 39 8V34C39 44 0 44 0 34Z"/><path d="M0 8C0 18 39 18 39 8M0 22C0 32 39 32 39 22" fill="none"/></g>
<text x="667" y="100" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="600" fill="#146c61">PostgreSQL + pgvector</text>
<text x="617" y="148" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#52667b">Store the FAQ entry and</text>
<text x="617" y="170" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#52667b">its embedding in a draft.</text>
<path d="M16 210H862" fill="none" stroke="#d3dfe8" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>
<text x="16" y="241" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="600" fill="#245db5">Answering a shopper</text>
<text x="16" y="284" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="600" fill="#203349">“Why did only one</text>
<text x="16" y="309" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="600" fill="#203349">parcel arrive?”</text>
<path d="M230 290H294" fill="none" stroke="#8093a4" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#tip)"/>
<text x="302" y="283" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600" fill="#203349">Embed the question</text>
<text x="302" y="307" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#52667b">Search the active version.</text>
<path d="M532 290H604" fill="none" stroke="#8093a4" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#tip)"/>
<text x="617" y="283" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600" fill="#146c61">Return the matching text</text>
<text x="617" y="307" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#52667b">The agent can explain</text>
<text x="617" y="329" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#52667b">why items ship separately.</text>
</svg>
