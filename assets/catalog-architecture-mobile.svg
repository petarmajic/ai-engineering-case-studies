<text x="18" y="75" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" fill="#086753">Implemented · initial load</text>
<rect x="18" y="90" width="344" height="66" rx="7" fill="#eaf2f8" stroke="none"/>
<text x="31" y="116" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#172f42">Local XLSX or CSV</text>
<text x="31" y="139" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#405b6a">Development command opens the file.</text>
