<text x="31" y="208" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#172f42">Python parser</text>
<text x="31" y="231" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#405b6a">Read typed rows and surface errors.</text>
<polyline points="41,248 41,270" fill="none" stroke="#6c8797" stroke-width="2" marker-end="url(#arrow)" />
<rect x="18" y="274" width="344" height="66" rx="7" fill="#eaf2f8" stroke="none"/>
<text x="31" y="300" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#172f42">Django → PostgreSQL</text>
<text x="31" y="323" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#405b6a">Save only when all required rows pass.</text>
