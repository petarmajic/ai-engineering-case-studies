<svg xmlns="http://www.w3.org/2000/svg" width="380" height="571" viewBox="0 0 380 571" role="img" aria-labelledby="t d">
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#6c8797"/></marker></defs>
<title id="t">Inside a support session</title><desc id="d">Production usage and an illustrative order lookup. The runtime selects a tool and the reply preserves both deliveries.</desc>
<rect x="0" y="0" width="380" height="571" rx="12" fill="#f8fafb" stroke="none"/>
<text x="18" y="40" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#172f42">Inside a support session</text>
<text x="18" y="96" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="bold" fill="#086753">≈30,000</text>
<text x="18" y="118" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" fill="#405b6a">production sessions</text>
<text x="201" y="96" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="bold" fill="#086753">5–8</text>
<text x="201" y="118" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" fill="#405b6a">messages on average</text>
<text x="201" y="137" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" fill="#405b6a">per successful session</text>
<polyline points="18,155 362,155" fill="none" stroke="#c2d0d6" stroke-width="2" />
<text x="18" y="182" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" fill="#235e88">Illustrative order lookup</text>
<text x="18" y="212" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="normal" fill="#172f42">“Where is the rest of my order?”</text>
<rect x="18" y="237" width="344" height="65" rx="7" fill="#eaf2f8" stroke="none"/>
<text x="31" y="263" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#172f42">LangGraph calls the order tool</text>
<text x="31" y="286" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#405b6a">The tool requests the order record.</text>
<polyline points="50,302 50,319" fill="none" stroke="#6c8797" stroke-width="2" marker-end="url(#arrow)" />
<rect x="18" y="322" width="344" height="85" rx="7" fill="#e7f4ed" stroke="none"/>
<text x="31" y="348" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#172f42">Python maps each delivery</text>
<text x="31" y="371" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#405b6a">Delivery A: delivered</text>
<text x="31" y="391" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#405b6a">Delivery B: in transit</text>
<polyline points="50,407 50,427" fill="none" stroke="#6c8797" stroke-width="2" marker-end="url(#arrow)" />
<rect x="18" y="430" width="344" height="65" rx="7" fill="#eaf2f8" stroke="none"/>
<text x="31" y="456" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#172f42">Reply to the shopper</text>
<text x="31" y="479" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#405b6a">“One parcel arrived. One is in transit.”</text>
<text x="18" y="535" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#086753">Trace review · OpenTelemetry → Phoenix</text>
</svg>
