<svg xmlns="http://www.w3.org/2000/svg" width="380" height="698" viewBox="0 0 380 698" role="img" aria-labelledby="t d">
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#6c8797"/></marker></defs>
<title id="t">Support architecture</title><desc id="d">The FastAPI entry point calls the agent runtime. The runtime uses Redis, order and ticket services and the FAQ tool. Administrators activate the knowledge version that the FAQ tool searches.</desc>
<rect x="0" y="0" width="380" height="698" rx="12" fill="#f8fafb" stroke="none"/>
<text x="18" y="40" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#172f42">Support assistant architecture</text>
<rect x="18" y="62" width="344" height="64" rx="7" fill="#eaf2f8" stroke="none"/>
<text x="31" y="88" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#172f42">Web widget → FastAPI</text>
<text x="31" y="111" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#405b6a">Receive the message and check the input.</text>
<polyline points="44,126 44,146" fill="none" stroke="#6c8797" stroke-width="2" marker-end="url(#arrow)" />
<rect x="18" y="149" width="344" height="65" rx="7" fill="#e7f4ed" stroke="none"/>
<text x="31" y="175" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#172f42">LangGraph + LangChain</text>
<text x="31" y="198" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#405b6a">Resume the thread and choose a tool.</text>
<polyline points="38,214 38,488" fill="none" stroke="#6c8797" stroke-width="2" />
<polyline points="38,278 62,278" fill="none" stroke="#6c8797" stroke-width="2" marker-end="url(#arrow)" />
<rect x="65" y="238" width="295" height="78" rx="7" fill="#eaf2f8" stroke="none"/>
<text x="78" y="264" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#172f42">Redis</text>
<text x="78" y="287" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#405b6a">Conversation state and attachments</text>
<polyline points="38,383 62,383" fill="none" stroke="#6c8797" stroke-width="2" marker-end="url(#arrow)" />
<rect x="65" y="343" width="295" height="78" rx="7" fill="#eaf2f8" stroke="none"/>
<text x="78" y="369" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#172f42">Order and CRM tools</text>
<text x="78" y="392" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#405b6a">Check an order or create a ticket.</text>
<polyline points="38,488 62,488" fill="none" stroke="#6c8797" stroke-width="2" marker-end="url(#arrow)" />
<rect x="65" y="448" width="295" height="78" rx="7" fill="#eaf2f8" stroke="none"/>
<text x="78" y="474" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#172f42">FAQ tool → PostgreSQL</text>
<text x="78" y="497" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#405b6a">Search active records with pgvector.</text>
<rect x="65" y="558" width="295" height="78" rx="7" fill="#e7f4ed" stroke="none"/>
<text x="78" y="584" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#172f42">Admin API</text>
<text x="78" y="607" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#405b6a">Validate a draft, then activate it.</text>
<polyline points="218,555 218,530" fill="none" stroke="#6c8797" stroke-width="2" marker-end="url(#arrow)" />
<text x="18" y="674" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#086753">Chat traces · OpenTelemetry → Phoenix</text>
</svg>
