<svg xmlns="http://www.w3.org/2000/svg" width="380" height="467" viewBox="0 0 380 467" role="img" aria-labelledby="t d">
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#6c8797"/></marker></defs>
<title id="t">The row outside the declared range</title><desc id="d">A synthetic workbook declares two rows, but contains a third row with another product.</desc>
<rect x="0" y="0" width="380" height="467" rx="12" fill="#f8fafb" stroke="none"/>
<text x="18" y="40" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#172f42">A row outside the range</text>
<text x="18" y="68" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#235e88">Illustrative supplier workbook</text>
<rect x="18" y="82" width="344" height="42" rx="0" fill="#eaf2f8" stroke="none"/>
<text x="32" y="109" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" fill="#405b6a">Row</text>
<text x="94" y="109" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" fill="#405b6a">Column A</text>
<text x="232" y="109" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" fill="#405b6a">Column B</text>
<rect x="18" y="124" width="344" height="41" rx="0" fill="#ffffff" stroke="none"/>
<text x="35" y="150" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" fill="#405b6a">1</text>
<text x="94" y="150" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#172f42">Product code</text>
<text x="232" y="150" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#172f42">Price</text>
<rect x="18" y="166" width="344" height="41" rx="0" fill="#ffffff" stroke="none"/>
<text x="35" y="192" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" fill="#405b6a">2</text>
<text x="94" y="192" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" fill="#172f42">000123</text>
<text x="232" y="192" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" fill="#172f42">12,345</text>
<rect x="18" y="208" width="344" height="41" rx="0" fill="#e7f4ed" stroke="none"/>
<text x="35" y="234" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" fill="#405b6a">3</text>
<text x="94" y="234" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" fill="#172f42">000124</text>
<text x="232" y="234" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" fill="#172f42">6,50</text>
<text x="18" y="292" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#405b6a">Declared range: A1:B2</text>
<text x="18" y="325" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" fill="#086753">Row 3 still contains a product.</text>
<text x="18" y="357" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" fill="#405b6a">A reader that stops at B2 can return</text>
<text x="18" y="379" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" fill="#405b6a">a plausible but incomplete catalog.</text>
</svg>
